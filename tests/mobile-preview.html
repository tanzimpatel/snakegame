<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CRT Snake - mobile preview</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      background: #101418;
      color: #9dff8a;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
    }

    figure {
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    figcaption {
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #7dff6b;
    }

    iframe {
      border: 1px solid #2c4a2a;
      background: #000;
    }
  </style>
</head>
<body>
  <figure>
    <figcaption>375 x 1150 (iphone)</figcaption>
    <iframe src="../index.html" width="375" height="1150"></iframe>
  </figure>
  <figure>
    <figcaption>320 x 1150 (small)</figcaption>
    <iframe src="../index.html" width="320" height="1150"></iframe>
  </figure>
</body>
</html>
